dual_mask: true   # 使用双掩码端到端模型 GTCRN_Binaural_Dual（两掩码分别作用于 ch0/ch1 后求和）
sample_rate: &sr 16000
batch_size: &bs 64

train_dataset:
  md_file: "/home/nis/jizhe.lu/Code/metadata/DNS3/train.json"
  wav_len: 4
  drb: "50ms_rts"
  fs: *sr
  dummy: false
  mode: 'train'

train_dataloader:
  batch_size: *bs
  num_workers: 10
  pin_memory: true
  prefetch_factor: 4
  shuffle: false

val_dataset:
  md_file: "/home/nis/jizhe.lu/Code/metadata/DNS3/val.json"
  wav_len: 4
  drb: "50ms_rts"
  fs: *sr
  dummy: false
  mode: 'val'

val_dataloader:
  batch_size: 1
  num_workers: 10
  pin_memory: true
  shuffle: false

test_dataset:
  md_file: "/home/nis/jizhe.lu/Code/metadata/DNS3/test.json"

network:
  num_channels: 32
  
loss:
  loss_func: "snr"
  alpha: 0.25

optimizer:
  lr: .0015

scheduler:
  mode: "min"
  factor: 0.5
  patience: 3
  verbose: false

# pretrained:
#   ckpt: '/data/ssd0/jizhe.lu/exps/ivaiss_pow_fixed/checkpoints/model_epoch1.tar'

trainer:
  epochs: 120
  save_checkpoint_interval: 1
  log_interval: 10
  clip_grad_norm_value: 3
  resume: false
  #exp_path: "/home/nis/jizhe.lu/Code/DNS3_2Mix_noisy_reverb/exps/derev"
  ckpt: "model_epoch1.tar"

